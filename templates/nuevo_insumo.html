<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrar Insumos | Estación 88</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 p-8 font-sans min-h-screen flex items-start justify-center">

    <div class="max-w-3xl w-full mx-auto flex flex-col gap-10">

        <div class="bg-white p-6 rounded-xl shadow-md border border-slate-200 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-black text-slate-800">📦 Panel de Insumos</h1>
                <p class="text-sm text-slate-500">Agrega existencias base o elimina del catálogo.</p>
            </div>
            <a href="/inventario" class="text-slate-500 hover:text-slate-800 font-bold text-sm bg-slate-100 hover:bg-slate-200 py-2 px-4 rounded-lg transition-colors">
                ⬅ Volver
            </a>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg border border-slate-200">
            <h2 class="text-xl font-bold text-orange-600 mb-4 border-b pb-2">➕ Registrar Nuevo Insumo</h2>
            <form method="POST" action="/nuevo_insumo" class="flex flex-col gap-4">
                <div class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-bold text-slate-700 mb-2">Nombre del Insumo:</label>
                        <input type="text" name="producto" required placeholder="Ej. Arroz, Frijol" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                    </div>
                    <div class="flex gap-4 flex-col sm:flex-row">
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Unidad de Medida:</label>
                            <input type="text" name="medida" required placeholder="Ej. Kg, L, Pz" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Presentación:</label>
                            <input type="text" name="presentacion" required placeholder="Ej. Caja 1L, Botella 600ml" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                    </div>
                    <div class="flex gap-4 flex-col sm:flex-row">
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Costo Total ($):</label>
                            <input type="number" step="any" name="precio" required placeholder="Ej. 38.00" class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Contenido:</label>
                            <input type="number" step="any" name="contenido" value="1" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Stock Inicial:</label>
                            <input type="number" step="any" name="cantidad" value="0" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
                        </div>
                        <div class="flex-1">
                            <label class="block text-sm font-bold text-slate-700 mb-2">Alerta Mínimo:</label>
                            <input type="number" step="any" name="minimo" value="5" required class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none font-bold text-red-600 bg-red-50/50 text-center">
                        </div>
                    </div>
                </div>
                <button type="submit" class="bg-orange-600 hover:bg-orange-700 text-white font-bold py-3 px-4 rounded-lg shadow transition-all w-full mt-2">
                    Guardar en Almacén
                </button>
            </form>
        </div>

        <div class="bg-white p-6 rounded-xl shadow-lg border border-red-200 bg-red-50/10">
            <h2 class="text-xl font-bold text-red-600 mb-4 border-b pb-2">🗑️ Eliminar Insumo del Catálogo</h2>
            <form method="POST" action="/eliminar_insumo" class="flex flex-col sm:flex-row gap-4 items-end" onsubmit="return confirm('¿Seguro que deseas borrar este insumo por completo del catálogo?');">
                <div class="flex-1 w-full">
                    <label class="block text-sm font-bold text-slate-700 mb-2">Selecciona el Insumo a dar de baja:</label>
                    <input list="lista-eliminar-insumo" name="producto_eliminar" required placeholder="Escribe el nombre del insumo..." autocomplete="off" class="w-full py-3 px-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 outline-none bg-white">
                    <datalist id="lista-eliminar-insumo">
                        {% for item in inventario %}
                            <option value="{{ item['Producto'] }}">{{ item['Producto'] }}</option>
                        {% endfor %}
                    </datalist>
                </div>
                <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-6 rounded-lg shadow transition-all w-full sm:w-auto whitespace-nowrap">
                    Eliminar Insumo
                </button>
            </form>
        </div>

    </div>
</body>
</html>
